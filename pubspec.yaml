name: flutter_task_manager_back4app
description: A production-ready Task Manager app built with Flutter and Back4App (Parse Server).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Parse Server SDK for Back4App
  parse_server_sdk_flutter: ^10.7.0

  # State management
  provider: ^6.1.2

  # Date formatting
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
